<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Game - IUEX Globe.Net</title>
<style>
  :root {
    --primary-blue: #0B4F9C;
    --electric-blue: #12A8F5;
    --bright-green: #22C55E;
    --white: #FFFFFF;
    --light-gray: #F5F7FA;
    --charcoal: #222831;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--light-gray);
    color: var(--charcoal);
    min-height: 100vh;
  }

  .top-bar { padding: 20px 30px; }
  .back-link {
    text-decoration: none;
    color: var(--primary-blue);
    font-size: 14px;
    font-weight: 600;
  }

  .container {
    max-width: 640px;
    margin: 0 auto 60px;
    padding: 0 20px;
  }

  .badge {
    display: inline-block;
    background: rgba(11, 79, 156, 0.08);
    color: var(--primary-blue);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
  }

  h1 { font-size: 28px; margin-bottom: 8px; color: var(--primary-blue); }
  p.sub { color: #667; font-size: 14px; margin-bottom: 30px; }

  .card {
    background: var(--white);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    margin-bottom: 24px;
  }

  .question-text {
    font-size: 19px;
    font-weight: 700;
    color: var(--charcoal);
    margin-bottom: 4px;
  }
  .question-category {
    display: inline-block;
    font-size: 12px;
    color: var(--primary-blue);
    background: rgba(11, 79, 156, 0.08);
    padding: 3px 10px;
    border-radius: 20px;
    margin-right: 8px;
  }
  .posted-by {
    font-size: 13px;
    color: #8899aa;
    margin-top: 8px;
    margin-bottom: 18px;
  }

  textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #d0d7e2;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
    min-height: 70px;
  }
  textarea:focus {
    outline: none;
    border-color: var(--electric-blue);
  }

  .form-hint {
    font-size: 12px;
    color: #8899aa;
    margin-top: 6px;
    margin-bottom: 12px;
  }

  button {
    background: var(--primary-blue);
    color: var(--white);
    border: none;
    padding: 12px 22px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  button:hover { background: var(--electric-blue); }
  button:disabled { background: #aab; cursor: not-allowed; }

  .msg { font-size: 14px; margin-top: 10px; }
  .msg.error { color: #e5484d; }
  .msg.success { color: var(--bright-green); font-weight: 600; }

  .answers-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .answers-header h2 { font-size: 17px; color: var(--primary-blue); }
  .answer-count { font-size: 13px; color: #8899aa; }

  .answer-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
    gap: 10px;
  }
  .answer-item:last-child { border-bottom: none; }
  .answer-item .name { font-weight: 600; font-size: 14px; color: var(--primary-blue); }
  .answer-item .text { font-size: 15px; margin-top: 2px; white-space: pre-wrap; color: var(--charcoal); }

  .answer-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .small-btn {
    padding: 6px 12px;
    font-size: 12px;
    border-radius: 6px;
  }
  .edit-btn { background: var(--electric-blue); }
  .edit-btn:hover { background: var(--primary-blue); }
  .delete-btn-small { background: #e5484d; }
  .delete-btn-small:hover { background: #c93c40; }

  .edit-box { flex: 1; }
  .edit-box textarea { margin-bottom: 8px; min-height: 50px; }
  .edit-box-actions { display: flex; gap: 8px; }
  .save-btn { background: var(--bright-green); }
  .save-btn:hover { background: #1ea854; }
  .cancel-btn { background: #99a3af; }
  .cancel-btn:hover { background: #7c8894; }

  .empty-state {
    text-align: center;
    padding: 30px 10px;
    color: #8899aa;
    font-size: 14px;
  }

  .locked-card { text-align: center; padding: 40px 20px; }
  .locked-card p { margin-bottom: 20px; color: #667; }
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html" class="back-link">&larr; Back to Home</a>
</div>

<div class="container">

  <span class="badge">FUN & ENTERTAINMENT</span>
  <h1>Today's Word Game</h1>
  <p class="sub">Answer today's question and see what everyone else guessed.</p>

  <!-- Shown if not logged in -->
  <div id="lockedSection" class="card locked-card" style="display:none;">
    <p>Sign in to join today's game and drop your answer.</p>
    <button onclick="window.location.href='signup.html'">Sign In / Sign Up</button>
  </div>

  <!-- Main game section -->
  <div id="gameSection" style="display:none;">

    <div class="card">
      <div id="questionBox">Loading today's question...</div>
      <form id="answerForm">
        <textarea id="answerInput" placeholder="Type your answer... (press Enter for a new line)" required></textarea>
        <div class="form-hint">Press Enter for a new line. Click Submit when ready.</div>
        <button type="submit" id="submitBtn">Submit</button>
      </form>
      <div id="submitMsg" class="msg"></div>
    </div>

    <div class="card">
      <div class="answers-header">
        <h2>Everyone's Answers</h2>
        <span class="answer-count" id="answerCount"></span>
      </div>
      <div id="answersList"></div>
    </div>

  </div>

</div>

<script>
  const API_BASE = "https://iuex-globe-net-backend.onrender.com/api/game";
  let currentQuestionId = null;
  let myEmail = null;
  let editingAnswerId = null;

  document.addEventListener("DOMContentLoaded", () => {
    const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";
    const savedAccount = JSON.parse(localStorage.getItem("userAccount") || "null");

    if (!isLoggedIn || !savedAccount) {
      document.getElementById("lockedSection").style.display = "block";
      return;
    }

    myEmail = savedAccount.email;

    document.getElementById("gameSection").style.display = "block";
    loadQuestion();

    // Auto-refresh every 8 seconds so it feels shared/live.
    // Skipped while a user is actively editing, so it doesn't wipe their in-progress edit.
    setInterval(() => {
      if (!editingAnswerId) loadQuestion();
    }, 8000);

    document.getElementById("answerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      await submitAnswer(savedAccount);
    });
  });

  async function loadQuestion() {
    const questionBox = document.getElementById("questionBox");
    const answersBox = document.getElementById("answersList");
    const answerCount = document.getElementById("answerCount");

    try {
      const res = await fetch(`${API_BASE}/today`);
      if (!res.ok) {
        questionBox.innerHTML = '<p style="color:#8899aa;">No game question has been posted yet. Check back soon!</p>';
        answersBox.innerHTML = "";
        answerCount.textContent = "";
        return;
      }
      const data = await res.json();
      currentQuestionId = data._id;

      questionBox.innerHTML = `
        <div class="question-text">${data.question}</div>
        <span class="question-category">${data.category}</span>
        <div class="posted-by">Posted by: ${data.postedBy || 'Admin'}</div>
      `;

      const answers = data.answers || [];
      answerCount.textContent = answers.length === 1 ? "1 answer" : `${answers.length} answers`;

      if (answers.length === 0) {
        answersBox.innerHTML = '<div class="empty-state">No one has answered yet — be the first!</div>';
        return;
      }

      answersBox.innerHTML = answers
        .slice()
        .reverse()
        .map(a => {
          const isMine = a.userId === myEmail;
          return `
            <div class="answer-item" data-answer-id="${a._id}">
              <div>
                <div class="name">${a.username}</div>
                <div class="text">${a.answer}</div>
              </div>
              ${isMine ? `
                <div class="answer-actions">
                <button class="small-btn edit-btn" onclick="startEdit('${a._id}')">Edit</button>
                <button class="small-btn delete-btn-small" onclick="deleteMyAnswer('${a._id}')">Delete</button>
              </div>
              ` : ""}
            </div>
          `;
        }).join("");

    } catch (err) {
      questionBox.innerHTML = '<p style="color:#e5484d;">Could not load today\'s question. Try refreshing.</p>';
    }
  }

  async function submitAnswer(savedAccount) {
    const input = document.getElementById("answerInput");
    const submitBtn = document.getElementById("submitBtn");
    const msgBox = document.getElementById("submitMsg");
    const answer = input.value.trim();

    msgBox.textContent = "";
    msgBox.className = "msg";

    if (!answer) return;
    if (!currentQuestionId) {
      msgBox.textContent = "No active question to answer right now.";
      msgBox.classList.add("error");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";

    try {
      const res = await fetch(`${API_BASE}/answer`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          questionId: currentQuestionId,
          userId: savedAccount.email,
          username: savedAccount.fullname,
          answer: answer
        })
      });
      const data = await res.json();

      if (res.ok) {
        msgBox.textContent = "Answer submitted!";
        msgBox.classList.add("success");
        input.value = "";
        loadQuestion();
      } else {
        msgBox.textContent = data.message || "Something went wrong.";
        msgBox.classList.add("error");
      }
    } catch (err) {
      msgBox.textContent = "Could not reach server. Try again.";
      msgBox.classList.add("error");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit";
    }
  }

 function startEdit(answerId) {
  editingAnswerId = answerId;
  const item = document.querySelector(`.answer-item[data-answer-id="${answerId}"]`);
  if (!item) return;

  const currentText = item.querySelector(".text").textContent;

  item.innerHTML = `
    <div class="edit-box">
      <textarea id="editInput-${answerId}">${currentText}</textarea>
        <div class="edit-box-actions">
          <button class="small-btn save-btn" onclick="saveEdit('${answerId}')">Save</button>
          <button class="small-btn cancel-btn" onclick="cancelEdit()">Cancel</button>
        </div>
      </div>
    `;
  }

  function cancelEdit() {
    editingAnswerId = null;
    loadQuestion();
  }

  async function saveEdit(answerId) {
    const textarea = document.getElementById(`editInput-${answerId}`);
    const newAnswer = textarea.value.trim();
    if (!newAnswer) return;

    try {
      await fetch(`${API_BASE}/answer/${currentQuestionId}/${answerId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ answer: newAnswer })
      });
      editingAnswerId = null;
      loadQuestion();
    } catch (err) {
      alert("Could not save your edit. Try again.");
    }
  }

  async function deleteMyAnswer(answerId) {
    if (!currentQuestionId) return;
    try {
      await fetch(`${API_BASE}/answer/${currentQuestionId}/${answerId}`, {
        method: "DELETE"
      });
      loadQuestion();
    } catch (err) {
      alert("Could not delete your answer. Try again.");
    }
  }
</script>

</body>
</html>
