<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - IUEX Globe.Net</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                <img src="images/Logo/MB Logo without name.png" alt="IUEX Globe.Net Logo">
                <h2>IUEX Globe.Net</h2>
            </div>

            <h1>Create Your Account</h1>
            <p class="auth-subtext">Join IUEX Globe.Net and unlock access to our products and courses.</p>

            <form class="auth-form">

                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" placeholder="Enter your full name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" required>

                <div class="auth-terms">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">
                        I agree to the <a href="terms.html">Terms & Conditions</a> and <a href="terms.html">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="cta-btn auth-submit">Sign Up</button>

            </form>

            <div class="auth-divider">
                <span>or</span>
            </div>

            <button class="google-btn">
    <svg width="20" height="20" viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.5 0 10.4-2.1 14.1-5.6l-6.5-5.5c-2 1.5-4.6 2.4-7.6 2.4-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.6 39.6 16.3 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.5 5.5C39.9 37 44 31.4 44 24c0-1.3-.1-2.7-.4-3.5z"/>
    </svg>
    Continue with Google
    <script src="js/auth.js"></script>
</button>

            <p class="auth-switch">
                Already have an account? <a href="signin.html">Sign In</a>
            </p>

        </div>

    </div>

</body>
</html>
