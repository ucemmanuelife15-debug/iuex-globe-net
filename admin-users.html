<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Users - IUEX Globe.Net Admin</title>
   <link rel="stylesheet" href="css/responsive.css">
<style>
  :root {
    --primary-blue: #0B4F9C;
    --electric-blue: #12A8F5;
    --bright-green: #22C55E;
    --white: #FFFFFF;
    --light-gray: #F5F7FA;
    --charcoal: #222831;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--light-gray);
    color: var(--charcoal);
    min-height: 100vh;
  }

  .top-bar { padding: 20px 30px; }
  .back-link {
    text-decoration: none;
    color: var(--primary-blue);
    font-size: 14px;
    font-weight: 600;
  }

  .container {
    max-width: 700px;
    margin: 0 auto 60px;
    padding: 0 20px;
  }

  .badge {
    display: inline-block;
    background: rgba(11, 79, 156, 0.08);
    color: var(--primary-blue);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
  }

  h1 { font-size: 24px; margin-bottom: 8px; color: var(--primary-blue); }
  p.sub { color: #667; font-size: 14px; margin-bottom: 20px; }

  .card {
    background: var(--white);
    border-radius: 16px;
    padding: 24px 28px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    margin-bottom: 24px;
  }

  .locked-card { text-align: center; padding: 40px 20px; }
  .locked-card p { margin-bottom: 20px; color: #667; }

  input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #d0d7e2;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--electric-blue); }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .card-header h2 { font-size: 17px; color: var(--primary-blue); }
  .count-pill {
    background: rgba(34,197,94,0.1);
    color: var(--bright-green);
    font-size: 13px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
  }

  .user-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid #eee;
  }
  .user-row:last-child { border-bottom: none; }

  .user-rank {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(11,79,156,0.08);
    color: var(--primary-blue);
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .user-name { font-weight: 600; font-size: 14px; }
  .user-email { font-size: 13px; color: #8899aa; margin-top: 2px; }

  .role-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 12px;
    margin-left: 8px;
  }
  .role-main { background: rgba(11,79,156,0.1); color: var(--primary-blue); }
  .role-admin { background: rgba(34,197,94,0.1); color: var(--bright-green); }

  .empty-state {
    text-align: center;
    padding: 30px 10px;
    color: #8899aa;
    font-size: 14px;
  }

  .loading-note {
    text-align: center;
    padding: 20px 10px;
    color: #8899aa;
    font-size: 13px;
  }
</style>
</head>
<body class="page-admin-manage">

<div class="top-bar">
  <a href="admin-dashboard.html" class="back-link">&larr; Back to Admin Dashboard</a>
</div>

<div class="container">

  <!-- Not an admin at all -->
  <div id="lockedSection" style="display:none;">
    <div class="card locked-card">
      <h1>Access Restricted</h1>
      <p class="sub">This area is only available to IUEX Globe.Net admins.</p>
      <a href="index.html" class="back-link">Return to Home</a>
    </div>
  </div>

  <!-- Main panel -->
  <div id="panelSection" style="display:none;">
    <span class="badge">ADMIN</span>
    <h1>All Users</h1>
    <p class="sub">Everyone who has signed up, in the order they joined.</p>

    <div class="card">
      <input type="text" id="searchInput" placeholder="Search by name or email..." oninput="renderList()">
    </div>

    <div class="card">
      <div class="card-header">
        <h2>Signed-Up Users</h2>
        <span class="count-pill" id="userCount">0</span>
      </div>
      <div id="userList">
        <div class="loading-note">Loading... (first load after inactivity can take up to a minute)</div>
      </div>
    </div>
  </div>

</div>

<script>
  const AUTH_BASE = "https://iuex-globe-net-backend.onrender.com/api/auth";
  let allUsers = [];

  document.addEventListener("DOMContentLoaded", () => {
    const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";
    const savedAccount = JSON.parse(localStorage.getItem("userAccount") || "null");

    if (!isLoggedIn || !savedAccount || !savedAccount.isAdmin) {
      document.getElementById("lockedSection").style.display = "block";
      return;
    }

    document.getElementById("panelSection").style.display = "block";
    loadUsers();
  });

  async function loadUsers() {
    const userList = document.getElementById("userList");
    try {
      const res = await fetch(`${AUTH_BASE}/all-users`);
      const data = await res.json();

      // Oldest-first: sort by _id, since MongoDB ObjectIds are
      // chronological by design — this works even if the backend
      // doesn't send a separate join-date field.
      allUsers = data.slice().sort((a, b) => (a._id > b._id ? 1 : -1));

      renderList();
    } catch (err) {
      userList.innerHTML = '<div class="empty-state">Could not load users.</div>';
    }
  }

  function renderList() {
    const userList = document.getElementById("userList");
    const search = document.getElementById("searchInput").value.trim().toLowerCase();

    let filtered = allUsers;
    if (search) {
      filtered = allUsers.filter(u =>
        u.fullname.toLowerCase().includes(search) ||
        u.email.toLowerCase().includes(search)
      );
    }

    document.getElementById("userCount").textContent = allUsers.length;

    if (filtered.length === 0) {
      userList.innerHTML = '<div class="empty-state">No users found.</div>';
      return;
    }

    userList.innerHTML = filtered.map(u => {
      const rank = allUsers.indexOf(u) + 1;

      let roleTag = "";
      if (u.isMainAdmin) roleTag = '<span class="role-tag role-main">Main Admin</span>';
      else if (u.isAdmin) roleTag = '<span class="role-tag role-admin">Admin</span>';

      return `
        <div class="user-row">
          <div class="user-rank">${rank}</div>
          <div>
            <div class="user-name">${u.fullname}${roleTag}</div>
            <div class="user-email">${u.email}</div>
          </div>
        </div>
      `;
    }).join("");
  }
</script>
<script src="js/auth-gate.js"></script>
<script src="js/session.js"></script>

</body>
</html>
