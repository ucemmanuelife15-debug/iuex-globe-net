<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Management - IUEX Globe.Net Admin</title>
   <link rel="stylesheet" href="css/responsive.css">
<style>
  :root {
    --primary-blue: #0B4F9C;
    --electric-blue: #12A8F5;
    --bright-green: #22C55E;
    --white: #FFFFFF;
    --light-gray: #F5F7FA;
    --charcoal: #222831;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--light-gray);
    color: var(--charcoal);
    min-height: 100vh;
  }

  .top-bar { padding: 20px 30px; }
  .back-link {
    text-decoration: none;
    color: var(--primary-blue);
    font-size: 14px;
    font-weight: 600;
  }

  .container {
    max-width: 640px;
    margin: 0 auto 60px;
    padding: 0 20px;
  }
  .card {
    background: var(--white);
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    margin-bottom: 24px;
  }
  h1 { font-size: 24px; margin-bottom: 8px; color: var(--primary-blue); }
  h2 { font-size: 18px; margin-bottom: 16px; color: var(--primary-blue); }
  p.sub { color: #667; font-size: 14px; margin-bottom: 20px; }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--charcoal);
    margin-bottom: 6px;
  }

  input, textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #d0d7e2;
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 14px;
    font-family: inherit;
    color: var(--charcoal);
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--electric-blue);
  }

  button {
    background: var(--primary-blue);
    color: var(--white);
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  button:hover { background: var(--electric-blue); }
  button:disabled { background: #aab; cursor: not-allowed; }

  .small-btn {
    padding: 8px 16px;
    font-size: 13px;
    min-width: 110px;
    text-align: center;
  }
  .edit-btn-q { background: var(--electric-blue); }
  .edit-btn-q:hover { background: var(--primary-blue); }
  .delete-btn { background: #e5484d; }
  .delete-btn:hover { background: #c93c40; }
  .save-btn { background: var(--bright-green); }
  .save-btn:hover { background: #1ea854; }
  .cancel-btn { background: #99a3af; }
  .cancel-btn:hover { background: #7c8894; }

  .locked-card {
    text-align: center;
    padding: 40px 20px;
  }
  .locked-card p { margin-bottom: 20px; color: #667; }

  .question-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    margin-bottom: 18px;
  }

  .answer-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
  }
  .answer-item:last-child { border-bottom: none; }
  .answer-text { font-size: 14px; color: var(--charcoal); }
  .answer-user { color: #8899aa; font-size: 12px; margin-top: 2px; }

  .error { color: #e5484d; font-size: 14px; margin-bottom: 10px; }
  .success { color: var(--bright-green); font-size: 14px; margin-bottom: 10px; font-weight: 600; }

  .badge {
    display: inline-block;
    background: rgba(11, 79, 156, 0.08);
    color: var(--primary-blue);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
  }

  .posted-by {
    font-size: 13px;
    color: #8899aa;
    margin-bottom: 4px;
  }

  .past-item {
    padding: 14px 0;
    border-bottom: 1px solid #eee;
  }
  .past-item:last-child { border-bottom: none; }
  .past-question { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .past-meta { font-size: 12px; color: #8899aa; margin-bottom: 8px; }
  .past-actions { display: flex; gap: 8px; }

  .loading-note {
    text-align: center;
    padding: 16px 10px;
    color: #8899aa;
    font-size: 13px;
  }
</style>
</head>
<body class="page-admin">

<div class="top-bar">
  <a href="admin-dashboard.html" class="back-link">&larr; Back to Admin Dashboard</a>
</div>

<div class="container">

  <!-- Shown if not an admin -->
  <div id="lockedSection" style="display:none;">
    <div class="card locked-card">
      <h1>Access Restricted</h1>
      <p class="sub">This area is only available to IUEX Globe.Net admins.</p>
      <a href="index.html" class="back-link">Return to Home</a>
    </div>
  </div>

  <!-- ADMIN PANEL SECTION -->
  <div id="panelSection" style="display:none;">
    <span class="badge">GAME MANAGEMENT</span>

    <div class="card">
      <h2>Post Today's Question</h2>
      <div id="createMsg"></div>

      <label for="posterNameInput">Your Name (shown to players as who posted it)</label>
      <input type="text" id="posterNameInput" placeholder="e.g. Admin, or your name">

      <label for="questionInput">Question</label>
      <input type="text" id="questionInput" placeholder="e.g. Name a tech word starting with M">

      <label for="categoryInput">Category</label>
      <input type="text" id="categoryInput" placeholder="Optional, default: Tech">

      <button id="postBtn" onclick="createQuestion()">Post Question</button>
    </div>

    <div class="card">
      <h2>Current Question & Answers</h2>
      <div id="currentQuestionWrap">Loading...</div>
      <div id="answersList"></div>
    </div>

    <div class="card">
      <h2>Past Questions</h2>
      <div id="pastList">Loading...</div>
    </div>

  </div>

</div>

<script>
  const API_BASE = "https://iuex-globe-net-backend.onrender.com/api/game";
  let currentQuestionData = null;

  document.addEventListener("DOMContentLoaded", () => {
    const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";
    const savedAccount = JSON.parse(localStorage.getItem("userAccount") || "null");

    if (!isLoggedIn || !savedAccount || !savedAccount.isAdmin) {
      document.getElementById("lockedSection").style.display = "block";
      return;
    }

    document.getElementById("panelSection").style.display = "block";

    const savedName = localStorage.getItem("adminPosterName");
    if (savedName) {
      document.getElementById("posterNameInput").value = savedName;
    }

    loadTodayQuestion();
    loadPastQuestions();
  });

  async function createQuestion() {
    const postedBy = document.getElementById("posterNameInput").value.trim() || "Admin";
    const question = document.getElementById("questionInput").value.trim();
    const category = document.getElementById("categoryInput").value.trim() || "Tech";
    const msgBox = document.getElementById("createMsg");
    const postBtn = document.getElementById("postBtn");
    msgBox.innerHTML = "";

    if (!question) {
      msgBox.innerHTML = '<div class="error">Please enter a question.</div>';
      return;
    }

    localStorage.setItem("adminPosterName", postedBy);

    postBtn.disabled = true;
    postBtn.textContent = "Please wait...";

    try {
      const res = await fetch(`${API_BASE}/create`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, category, postedBy })
      });
      const data = await res.json();

      if (res.ok) {
        msgBox.innerHTML = '<div class="success">Question posted!</div>';
        document.getElementById("questionInput").value = "";
        document.getElementById("categoryInput").value = "";
        loadTodayQuestion();
        loadPastQuestions();
      } else {
        msgBox.innerHTML = `<div class="error">${data.message || 'Something went wrong.'}</div>`;
      }
    } catch (err) {
      msgBox.innerHTML = '<div class="error">Could not reach server.</div>';
    } finally {
      postBtn.disabled = false;
      postBtn.textContent = "Post Question";
    }
  }

  async function loadTodayQuestion() {
    const wrap = document.getElementById("currentQuestionWrap");
    const answersBox = document.getElementById("answersList");
    wrap.innerHTML = '<div class="loading-note">Loading... (first load after inactivity can take up to a minute)</div>';

    try {
      const res = await fetch(`${API_BASE}/today`);
      if (!res.ok) {
        wrap.textContent = "No question set yet.";
        answersBox.innerHTML = "";
        return;
      }
      const data = await res.json();
      currentQuestionData = data;
      renderCurrentQuestion(data);

      if (!data.answers || data.answers.length === 0) {
        answersBox.innerHTML = '<p style="color:#8899aa;font-size:14px;margin-top:10px;">No answers yet.</p>';
        return;
      }

      answersBox.innerHTML = data.answers.map(a => `
        <div class="answer-item">
          <div>
            <div class="answer-text">${a.answer}</div>
            <div class="answer-user">${a.username}</div>
          </div>
          <button class="small-btn delete-btn" id="del-${a._id}" onclick="deleteAnswer('${data._id}', '${a._id}')">Delete</button>
        </div>
      `).join("");

    } catch (err) {
      wrap.textContent = "Could not load question.";
    }
  }

  function renderCurrentQuestion(data) {
    const wrap = document.getElementById("currentQuestionWrap");
    wrap.innerHTML = `
      <div class="posted-by">Posted by: ${data.postedBy || 'Admin'}</div>
      <strong>${data.question}</strong> <span style="color:#8899aa;font-size:13px;">(${data.category})</span>
      <div class="question-actions">
        <button class="small-btn edit-btn-q" onclick="editCurrentQuestion()">Edit Question</button>
        <button class="small-btn delete-btn" id="deleteQBtn" onclick="deleteCurrentQuestion()">Delete Question</button>
      </div>
    `;
  }

  function editCurrentQuestion() {
    if (!currentQuestionData) return;
    const wrap = document.getElementById("currentQuestionWrap");
    wrap.innerHTML = `
      <label>Question</label>
      <input type="text" id="editQInput" value="${currentQuestionData.question}">
      <label>Category</label>
      <input type="text" id="editCatInput" value="${currentQuestionData.category}">
      <div class="question-actions">
        <button class="small-btn save-btn" id="saveQBtn" onclick="saveCurrentQuestion()">Save</button>
        <button class="small-btn cancel-btn" onclick="renderCurrentQuestion(currentQuestionData)">Cancel</button>
      </div>
    `;
  }

  async function saveCurrentQuestion() {
    const question = document.getElementById("editQInput").value.trim();
    const category = document.getElementById("editCatInput").value.trim();
    const saveBtn = document.getElementById("saveQBtn");
    if (!question) return;

    if (saveBtn) {
      saveBtn.disabled = true;
      saveBtn.textContent = "Please wait...";
    }

    try {
      await fetch(`${API_BASE}/question/${currentQuestionData._id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, category })
      });
      loadTodayQuestion();
      loadPastQuestions();
    } catch (err) {
      alert("Could not save changes. Try again.");
      if (saveBtn) {
        saveBtn.disabled = false;
        saveBtn.textContent = "Save";
      }
    }
  }

  async function deleteCurrentQuestion() {
    if (!currentQuestionData) return;
    if (!confirm("Delete this question and all its answers? This cannot be undone.")) return;

    const deleteQBtn = document.getElementById("deleteQBtn");
    if (deleteQBtn) {
      deleteQBtn.disabled = true;
      deleteQBtn.textContent = "Please wait...";
    }

    try {
      await fetch(`${API_BASE}/question/${currentQuestionData._id}`, {
        method: "DELETE"
      });
      loadTodayQuestion();
      loadPastQuestions();
    } catch (err) {
      alert("Could not delete question. Try again.");
      if (deleteQBtn) {
        deleteQBtn.disabled = false;
        deleteQBtn.textContent = "Delete Question";
      }
    }
  }

  async function deleteAnswer(questionId, answerId) {
    const btn = document.getElementById(`del-${answerId}`);
    if (btn) {
      btn.disabled = true;
      btn.textContent = "Please wait...";
    }
    try {
      await fetch(`${API_BASE}/answer/${questionId}/${answerId}`, {
        method: "DELETE"
      });
      loadTodayQuestion();
    } catch (err) {
      alert("Could not delete answer. Try again.");
      if (btn) {
        btn.disabled = false;
        btn.textContent = "Delete";
      }
    }
  }

  async function loadPastQuestions() {
    const pastList = document.getElementById("pastList");
    pastList.innerHTML = '<div class="loading-note">Loading...</div>';
    try {
      const res = await fetch(`${API_BASE}/all`);
      const all = await res.json();

      const past = all.slice(1);

      if (past.length === 0) {
        pastList.innerHTML = '<p style="color:#8899aa;font-size:14px;">No past questions yet.</p>';
        return;
      }

      pastList.innerHTML = past.map(q => `
        <div class="past-item">
          <div class="past-question">${q.question}</div>
          <div class="past-meta">${q.category} · Posted by ${q.postedBy || 'Admin'} · ${new Date(q.date).toLocaleDateString()} · ${(q.answers || []).length} answer(s)</div>
          <div class="past-actions">
            <button class="small-btn delete-btn" id="delpast-${q._id}" onclick="deletePastQuestion('${q._id}')">Delete</button>
          </div>
        </div>
      `).join("");

    } catch (err) {
      pastList.innerHTML = '<p style="color:#e5484d;font-size:14px;">Could not load past questions.</p>';
    }
  }

  async function deletePastQuestion(id) {
    if (!confirm("Delete this past question and all its answers? This cannot be undone.")) return;
    const btn = document.getElementById(`delpast-${id}`);
    if (btn) {
      btn.disabled = true;
      btn.textContent = "Please wait...";
    }
    try {
      await fetch(`${API_BASE}/question/${id}`, {
        method: "DELETE"
      });
      loadPastQuestions();
    } catch (err) {
      alert("Could not delete question. Try again.");
      if (btn) {
        btn.disabled = false;
        btn.textContent = "Delete";
      }
    }
  }
</script>
<script src="js/auth-gate.js"></script>
<script src="js/session.js"></script>

</body>
</html>
