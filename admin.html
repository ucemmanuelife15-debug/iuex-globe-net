<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - IUEX Globe.Net</title>
<style>
  :root {
    --primary-blue: #0B4F9C;
    --electric-blue: #12A8F5;
    --bright-green: #22C55E;
    --white: #FFFFFF;
    --light-gray: #F5F7FA;
    --charcoal: #222831;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--light-gray);
    color: var(--charcoal);
    min-height: 100vh;
  }
  .container {
    max-width: 640px;
    margin: 60px auto;
    padding: 0 20px;
  }
  .card {
    background: var(--white);
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    margin-bottom: 24px;
  }
  h1 { font-size: 24px; margin-bottom: 8px; color: var(--primary-blue); }
  h2 { font-size: 18px; margin-bottom: 16px; color: var(--primary-blue); }
  p.sub { color: #667; font-size: 14px; margin-bottom: 20px; }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--charcoal);
    margin-bottom: 6px;
  }

  input, textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #d0d7e2;
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 14px;
    font-family: inherit;
    color: var(--charcoal);
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--electric-blue);
  }

  button {
    background: var(--primary-blue);
    color: var(--white);
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  button:hover { background: var(--electric-blue); }

  #loginSection, #panelSection { display: none; }

  .answer-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
  }
  .answer-item:last-child { border-bottom: none; }
  .answer-text { font-size: 14px; color: var(--charcoal); }
  .answer-user { color: #8899aa; font-size: 12px; margin-top: 2px; }
  .delete-btn {
    background: #e5484d;
    padding: 6px 14px;
    font-size: 13px;
    border-radius: 6px;
  }
  .delete-btn:hover { background: #c93c40; }

  .error { color: #e5484d; font-size: 14px; margin-bottom: 10px; }
  .success { color: var(--bright-green); font-size: 14px; margin-bottom: 10px; font-weight: 600; }

  .badge {
    display: inline-block;
    background: rgba(11, 79, 156, 0.08);
    color: var(--primary-blue);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
  }

  .posted-by {
    font-size: 13px;
    color: #8899aa;
    margin-bottom: 14px;
  }
</style>
</head>
<body>

<div class="container">

  <!-- LOGIN SECTION -->
  <div id="loginSection" class="card" style="display:block;">
    <span class="badge">ADMIN ACCESS</span>
    <h1>Admin Login</h1>
    <p class="sub">IUEX Globe.Net — Game Admin</p>
    <div id="loginError" class="error"></div>
    <input type="password" id="adminPassword" placeholder="Admin password">
    <button onclick="login()">Log In</button>
  </div>

  <!-- ADMIN PANEL SECTION -->
  <div id="panelSection">

    <div class="card">
      <h2>Post Today's Question</h2>
      <div id="createMsg"></div>

      <label for="posterNameInput">Your Name (shown to players as who posted it)</label>
      <input type="text" id="posterNameInput" placeholder="e.g. Admin, or your name">

      <label for="questionInput">Question</label>
      <input type="text" id="questionInput" placeholder="e.g. Name a tech word starting with M">

      <label for="categoryInput">Category</label>
      <input type="text" id="categoryInput" placeholder="Optional, default: Tech">

      <button onclick="createQuestion()">Post Question</button>
    </div>

    <div class="card">
      <h2>Current Question & Answers</h2>
      <div id="currentQuestion">Loading...</div>
      <div id="answersList"></div>
    </div>

  </div>

</div>

<script>
  const API_BASE = "https://iuex-globe-net-backend.onrender.com/api/game";
  let adminPassword = "";

  // Remember the last name used, so the admin doesn't retype it every time
  document.addEventListener("DOMContentLoaded", () => {
    const savedName = localStorage.getItem("adminPosterName");
    if (savedName) {
      const el = document.getElementById("posterNameInput");
      if (el) el.value = savedName;
    }
  });

  async function login() {
    const password = document.getElementById("adminPassword").value;
    const errorBox = document.getElementById("loginError");
    errorBox.textContent = "";

    try {
      const res = await fetch(`${API_BASE}/admin-login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password })
      });
      const data = await res.json();

      if (data.success) {
        adminPassword = password;
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("panelSection").style.display = "block";
        loadTodayQuestion();
      } else {
        errorBox.textContent = "Incorrect password.";
      }
    } catch (err) {
      errorBox.textContent = "Could not reach server. Try again.";
    }
  }

  async function createQuestion() {
    const postedBy = document.getElementById("posterNameInput").value.trim() || "Admin";
    const question = document.getElementById("questionInput").value.trim();
    const category = document.getElementById("categoryInput").value.trim() || "Tech";
    const msgBox = document.getElementById("createMsg");
    msgBox.innerHTML = "";

    if (!question) {
      msgBox.innerHTML = '<div class="error">Please enter a question.</div>';
      return;
    }

    localStorage.setItem("adminPosterName", postedBy);

    try {
      const res = await fetch(`${API_BASE}/create`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, category, postedBy })
      });
      const data = await res.json();

      if (res.ok) {
        msgBox.innerHTML = '<div class="success">Question posted!</div>';
        document.getElementById("questionInput").value = "";
        document.getElementById("categoryInput").value = "";
        loadTodayQuestion();
      } else {
        msgBox.innerHTML = `<div class="error">${data.message || 'Something went wrong.'}</div>`;
      }
    } catch (err) {
      msgBox.innerHTML = '<div class="error">Could not reach server.</div>';
    }
  }

  async function loadTodayQuestion() {
    const questionBox = document.getElementById("currentQuestion");
    const answersBox = document.getElementById("answersList");

    try {
      const res = await fetch(`${API_BASE}/today`);
      if (!res.ok) {
        questionBox.textContent = "No question set yet.";
        answersBox.innerHTML = "";
        return;
      }
      const data = await res.json();
      questionBox.innerHTML = `
        <strong>${data.question}</strong> <span style="color:#8899aa;font-size:13px;">(${data.category})</span>
        <div class="posted-by">Posted by: ${data.postedBy || 'Admin'}</div>
      `;

      if (!data.answers || data.answers.length === 0) {
        answersBox.innerHTML = '<p style="color:#8899aa;font-size:14px;margin-top:10px;">No answers yet.</p>';
        return;
      }

      answersBox.innerHTML = data.answers.map(a => `
        <div class="answer-item">
          <div>
            <div class="answer-text">${a.answer}</div>
            <div class="answer-user">${a.username}</div>
          </div>
          <button class="delete-btn" onclick="deleteAnswer('${data._id}', '${a._id}')">Delete</button>
        </div>
      `).join("");

    } catch (err) {
      questionBox.textContent = "Could not load question.";
    }
  }

  async function deleteAnswer(questionId, answerId) {
    try {
      await fetch(`${API_BASE}/answer/${questionId}/${answerId}`, {
        method: "DELETE"
      });
      loadTodayQuestion();
    } catch (err) {
      alert("Could not delete answer. Try again.");
    }
  }
</script>

</body>
</html>
