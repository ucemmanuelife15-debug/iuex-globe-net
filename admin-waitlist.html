<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waitlists - IUEX Globe.Net Admin</title>
 <link rel="stylesheet" href="css/responsive.css">
<style>
  :root {
    --primary-blue: #0B4F9C;
    --electric-blue: #12A8F5;
    --bright-green: #22C55E;
    --white: #FFFFFF;
    --light-gray: #F5F7FA;
    --charcoal: #222831;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--light-gray);
    color: var(--charcoal);
    min-height: 100vh;
  }

  .top-bar { padding: 20px 30px; }
  .back-link {
    text-decoration: none;
    color: var(--primary-blue);
    font-size: 14px;
    font-weight: 600;
  }

  .container {
    max-width: 800px;
    margin: 0 auto 60px;
    padding: 0 20px;
  }

  .badge {
    display: inline-block;
    background: rgba(11, 79, 156, 0.08);
    color: var(--primary-blue);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
  }

  h1 { font-size: 28px; margin-bottom: 8px; color: var(--primary-blue); }
  p.sub { color: #667; font-size: 14px; margin-bottom: 30px; }

  .locked-card {
    background: var(--white);
    border-radius: 16px;
    padding: 40px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }

  .tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .tab-btn {
    padding: 10px 20px;
    border-radius: 30px;
    border: 1px solid #d0d7e2;
    background: var(--white);
    color: var(--charcoal);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--primary-blue);
    color: var(--white);
    border-color: var(--primary-blue);
  }

  .card {
    background: var(--white);
    border-radius: 16px;
    padding: 24px 28px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .card-header h2 { font-size: 17px; color: var(--primary-blue); }
  .count-pill {
    background: rgba(34,197,94,0.1);
    color: var(--bright-green);
    font-size: 13px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
  }

  .user-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
  }
  .user-row:last-child { border-bottom: none; }
  .user-name { font-weight: 600; font-size: 14px; }
  .user-email { font-size: 13px; color: #8899aa; margin-top: 2px; }

  .mail-btn {
    display: inline-block;
    background: var(--electric-blue);
    color: var(--white);
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 6px;
  }
  .mail-btn:hover { background: var(--primary-blue); }

  .empty-state {
    text-align: center;
    padding: 30px 10px;
    color: #8899aa;
    font-size: 14px;
  }

  .loading-note {
    text-align: center;
    padding: 20px 10px;
    color: #8899aa;
    font-size: 13px;
  }
</style>
</head>
<body class="page-admin-waitlist">

<div class="top-bar">
  <a href="admin-dashboard.html" class="back-link">&larr; Back to Admin Dashboard</a>
</div>

<div class="container">

  <div id="lockedSection" style="display:none;">
    <div class="locked-card">
      <h1>Access Restricted</h1>
      <p class="sub">This area is only available to IUEX Globe.Net admins.</p>
      <a href="index.html" class="back-link">Return to Home</a>
    </div>
  </div>

  <div id="panelSection" style="display:none;">
    <span class="badge">ADMIN</span>
    <h1>Product Waitlists</h1>
    <p class="sub">See who's waiting for ELink and ERoute to launch.</p>

    <div class="tabs">
      <button class="tab-btn active" id="tabElink" onclick="showTab('elink')">ELink</button>
      <button class="tab-btn" id="tabEroute" onclick="showTab('eroute')">ERoute</button>
    </div>

    <div class="card">
      <div class="card-header">
        <h2 id="listTitle">ELink Waitlist</h2>
        <span class="count-pill" id="listCount">0</span>
      </div>
      <div id="userList">
        <div class="loading-note">Loading... (first load after inactivity can take up to a minute)</div>
      </div>
    </div>
  </div>

</div>

<script>
  const API_BASE = "https://iuex-globe-net-backend.onrender.com/api/auth";
  let allUsers = [];
  let currentTab = "elink";
  let hasLoaded = false;

  document.addEventListener("DOMContentLoaded", () => {
    const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";
    const savedAccount = JSON.parse(localStorage.getItem("userAccount") || "null");

    if (!isLoggedIn || !savedAccount || !savedAccount.isAdmin) {
      document.getElementById("lockedSection").style.display = "block";
      return;
    }

    document.getElementById("panelSection").style.display = "block";
    loadWaitlist();
  });

  async function loadWaitlist() {
    const userList = document.getElementById("userList");
    try {
      const token = localStorage.getItem("authToken");
      const res = await fetch(`${API_BASE}/waitlist-users`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      allUsers = await res.json();
      hasLoaded = true;
      renderList();
    } catch (err) {
      userList.innerHTML = '<div class="empty-state">Could not load waitlist data.</div>';
    }
  }

  function showTab(product) {
    currentTab = product;
    document.getElementById("tabElink").classList.toggle("active", product === "elink");
    document.getElementById("tabEroute").classList.toggle("active", product === "eroute");
    document.getElementById("listTitle").textContent =
      (product === "elink" ? "ELink" : "ERoute") + " Waitlist";

    if (!hasLoaded) {
      document.getElementById("userList").innerHTML =
        '<div class="loading-note">Loading... (first load after inactivity can take up to a minute)</div>';
      return;
    }
    renderList();
  }

  function renderList() {
    const userList = document.getElementById("userList");
    const filtered = allUsers.filter(u => (u.interestedProducts || []).includes(currentTab));

    document.getElementById("listCount").textContent = filtered.length;

    const productLabel = currentTab === "elink" ? "ELink" : "ERoute";

    if (filtered.length === 0) {
      userList.innerHTML = `<div class="empty-state">No one has joined the ${productLabel} waitlist yet.</div>`;
      return;
    }

    userList.innerHTML = filtered.map(u => `
      <div class="user-row">
        <div>
          <div class="user-name">${u.fullname}</div>
          <div class="user-email">${u.email}</div>
        </div>
        <a class="mail-btn" href="mailto:${u.email}?subject=${productLabel} is launching!">Email</a>
      </div>
    `).join("");
  }
</script>
<script src="js/auth-gate.js"></script>
<script src="js/session.js"></script>

</body>
</html>
