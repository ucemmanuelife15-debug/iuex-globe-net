<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses - IUEX Globe.Net</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
      body.page-dashboard{
        display:flex;
        flex-direction:column;
        min-height:100vh;
        padding-top:0;
        background:#f4f7fb;
      }
      .page-dashboard .dash-top{
        padding:20px 30px 0;
      }
      .page-dashboard .dash-top .back-link{
        margin-bottom:8px;
      }
      .page-dashboard .dashboard-page{
        flex:1;
        min-height:0;
      }
    </style>
</head>
<body class="page-dashboard">

    <script>
      if (localStorage.getItem("isLoggedIn") !== "true") {
        localStorage.setItem("redirectAfterAuth", "dashboard.html");
        window.location.href = "signup.html";
      }
    </script>

    <div class="dash-top">
        <a href="index.html" class="back-link" onclick="history.back(); return false;">&larr; Back</a>
        <div class="mobile-page-breadcrumb">
            <div class="crumb-row"><span class="crumb-home">Home</span><span class="crumb-sep">/</span><span class="crumb-current">My Courses</span></div>
            <div class="quicklinks-row">
                <a href="products.html" class="quick-products">Products</a>
                <a href="game.html" class="quick-game">Game</a>
                <a href="community.html" class="quick-community">Community</a>
            </div>
        </div>
    </div>

    <div class="dashboard-page">

        <div class="dashboard-card">

            <div class="auth-logo">
                <img src="images/Logo/MB Logo without name.png" alt="IUEX Globe.Net Logo">
                <h2>IUEX Globe.Net</h2>
            </div>

            <h1 id="welcomeMessage">Welcome!</h1>

            <div class="my-courses-empty">
                <div class="catalog-empty-icon">📚</div>
                <h3>No Enrolled Courses Yet</h3>
                <p class="auth-subtext">
                    You haven't enrolled in any courses yet. Browse our catalog to get started once enrollment opens.
                </p>
                <a href="courses.html" class="cta-btn">Explore Courses</a>
            </div>

            <button id="signOutBtn" class="cta-btn-outline auth-submit">Sign Out</button>

        </div>

    </div>

    <script src="js/auth.js"></script>
    <script src="js/auth-gate.js"></script>
    <script src="js/session.js"></script>

</body>
</html>
