<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - IUEX Globe.Net</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="dashboard-page">

        <div class="dashboard-card">

            <div class="auth-logo">
                <img src="images/Logo/MB Logo without name.png" alt="IUEX Globe.Net Logo">
                <h2>IUEX Globe.Net</h2>
            </div>

            <h1 id="welcomeMessage">Welcome!</h1>
            <p class="auth-subtext">
                This is your dashboard. Courses, job listings, and more will appear here soon.
            </p>

            <button id="signOutBtn" class="cta-btn auth-submit">Sign Out</button>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>
</html>
