<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - IUEX Globe.Net</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="page-reset-password">

    <div class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                <img src="images/Logo/MB Logo without name.png" alt="IUEX Globe.Net Logo">
                <h2>IUEX Globe.Net</h2>
            </div>

            <h1>Reset Your Password</h1>
            <p class="auth-subtext">Enter a new password for your account.</p>

            <form class="reset-password-form">

              <label for="newPassword">New Password</label>
<div class="password-field">
    <input type="password" id="newPassword" placeholder="Enter new password" required>
    <button type="button" class="password-toggle" data-target="newPassword" aria-label="Show password">
        👁️
    </button>
</div>

<label for="confirmPassword">Confirm New Password</label>
<div class="password-field">
    <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
    <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Show password">
        👁️
    </button>
</div>

                <button type="submit" class="cta-btn auth-submit">Reset Password</button>

            </form>

            <p class="auth-switch">
                <a href="signin.html">Back to Sign In</a>
            </p>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>
</html>
