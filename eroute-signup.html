<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join ERoute - IUEX Globe.Net</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="auth-page eroute-theme">

        <div class="auth-card">

            <div class="auth-logo">
                <img src="images/Logo/Eroute logo with name.png" alt="ERoute Logo" class="product-logo">
            </div>

            <h1>Join ERoute</h1>
            <p class="auth-subtext">ERoute is currently in development. Sign up now to be notified the moment it launches, and get early access.</p>

                <form id="waitlistForm" class="auth-form">

                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" placeholder="Enter your full name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label for="password">Password</label>
                <div class="password-field">
                    <input type="password" id="password" placeholder="Create a password" required>
                    <span class="toggle-password" id="togglePassword">👁</span>
                </div>

                <div class="auth-terms">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">
                        I agree to the <a href="terms.html">Terms & Conditions</a> and <a href="terms.html">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="cta-btn auth-submit" id="waitlistBtn">Join ERoute Waitlist</button>

            </form>

            <p class="auth-switch">
                <a href="eroute.html">← Back to ERoute</a>
            </p>

        </div>

    </div>

    <script>
      const togglePassword = document.getElementById("togglePassword");
      const passwordInput = document.getElementById("password");
      togglePassword.addEventListener("click", () => {
        const isHidden = passwordInput.type === "password";
        passwordInput.type = isHidden ? "text" : "password";
        togglePassword.textContent = isHidden ? "🙈" : "👁";
      });

      const waitlistForm = document.getElementById("waitlistForm");
      const waitlistBtn = document.getElementById("waitlistBtn");
      const originalBtnText = waitlistBtn.textContent;

      waitlistForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const fullname = document.getElementById("fullname").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        const termsChecked = document.getElementById("terms").checked;

        if (!fullname || !email || !password) {
          alert("Please fill in all fields.");
          return;
        }

        if (!termsChecked) {
          alert("Please agree to the Terms & Conditions to continue.");
          return;
        }

        waitlistBtn.disabled = true;
        waitlistBtn.textContent = "Please wait...";

        try {
          const response = await fetch("https://iuex-globe-net-backend.onrender.com/api/auth/signup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ fullname, email, password }),
          });

          const data = await response.json();

          if (response.ok) {
            alert("You're on the ERoute waitlist! We'll notify you the moment ERoute launches.");
            window.location.href = "eroute.html?joined=true";
          } else {
            alert(data.message);
            waitlistBtn.disabled = false;
            waitlistBtn.textContent = originalBtnText;
          }
        } catch (error) {
          alert("Something went wrong. Please try again.");
          waitlistBtn.disabled = false;
          waitlistBtn.textContent = originalBtnText;
        }
      });
    </script>

</body>
</html>
