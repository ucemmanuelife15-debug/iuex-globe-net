<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join ERoute - IUEX Globe.Net</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="auth-page eroute-theme">

        <div class="auth-card">

            <div class="auth-logo">
                <img src="images/Logo/Eroute logo with name.png" alt="ERoute Logo" class="product-logo">
            </div>

            <h1>Join ERoute</h1>
            <p class="auth-subtext">ERoute is currently in development. Sign up now to be notified the moment it launches, and get early access.</p>

            <form class="auth-form eroute-signup-form">

                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" placeholder="Enter your full name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" required>

                <button type="submit" class="cta-btn auth-submit">Join ERoute Waitlist</button>

            </form>

            <p class="auth-switch">
                <a href="eroute.html">← Back to ERoute</a>
            </p>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>
</html>
