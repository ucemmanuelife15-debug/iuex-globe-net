<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - IUEX Globe.Net</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                <img src="images/Logo/MB Logo without name.png" alt="IUEX Globe.Net Logo">
                <h2>IUEX Globe.Net</h2>
            </div>

            <h1>Forgot Password</h1>
            <p class="auth-subtext">Enter your email address and we'll send you a link to reset your password.</p>

            <form class="forgot-password-form">

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <button type="submit" class="cta-btn auth-submit">Send Reset Link</button>

            </form>

            <p class="auth-switch">
                Remember your password? <a href="signin.html">Sign In</a>
            </p>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>
</html>
